<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <script>
      // Suppress Vite HMR WebSocket proxy disconnect errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack)) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('@vite/client'))) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || event.filename)) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('@vite/client'))) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
